name: Daily Ephemeris

on:
  schedule:
    # Runs at 18:00 UTC every day (23:30 IST)
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyswisseph astral pytz

      - name: Run ephemeris engine
        run: python Compute_ephemeris.py

      - name: Commit and push JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ephemeris.json
          git commit -m "Auto-update daily ephemeris" || echo "No changes to commit"
          git push
